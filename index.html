<!-- [코대리] 기존에 발송된 초대장과 이 기기의 일정 진행 기록을 공식 주소로 옮긴다. -->
<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>WITY 하롱베이 컨퍼런스 초대장</title>
<link rel="canonical" href="https://invite.2wity.com/"><meta property="og:url" content="https://invite.2wity.com/">
<meta property="og:title" content="당신을 초대합니다"><meta property="og:description" content="이름을 담은 WITY 하롱베이 컨퍼런스 초대장을 만나 보세요.">
<meta property="og:image" content="https://invite.2wity.com/assets/share.jpg"></head><body><p><a id="official" href="https://invite.2wity.com/">하롱베이 컨퍼런스 초대장 열기</a></p>
<script>
const link=document.getElementById('official');
const target=new URL(link.href);
target.hash=location.hash;
const card=location.hash.match(/^#i=1\.([a-f0-9]{32})\./);
try{
  if(card){
    const progress=localStorage.getItem('wity-halong-route-v1:'+card[1]);
    if(progress!==null&&/^\d{1,2}$/.test(progress))target.searchParams.set('resume',progress);
  }
}catch{}
link.href=target.href;
location.replace(target.href);
</script></body></html>
